<dialog id="accountDialog"><div class="dialog-head"><h2 data-i18n="profileTitle">Ваш профиль</h2><button class="icon-btn" data-close data-icon="x" data-aria="close"></button></div><div id="accountContent"></div></dialog><dialog id="reviewDialog"><div class="dialog-head"><h2 data-i18n="writeReview">Оставить отзыв</h2><button class="icon-btn" data-close data-icon="x" data-aria="close"></button></div><form id="reviewForm" class="dialog-form"><label><span data-i18n="reviewPlace">О чём расскажем?</span><select id="reviewPlace"></select></label><label><span data-i18n="reviewRating">Ваша оценка</span><select id="reviewRating"><option value="5">5 / 5</option><option value="4">4 / 5</option><option value="3">3 / 5</option><option value="2">2 / 5</option><option value="1">1 / 5</option></select></label><label><span data-i18n="reviewText">Ваши впечатления</span><textarea id="reviewText" required minlength="10" maxlength="1500" data-placeholder="reviewPlaceholder"></textarea></label><p class="small" data-i18n="localReviews">Демонстрация без сервера: профили и отзывы хранятся в этом браузере, не публикуются и не видны другим посетителям.</p><p class="form-error" id="reviewError" role="alert"></p><button class="btn terra" data-i18n="saveReview">Сохранить отзыв</button></form></dialog><dialog id="randomDialog"><div class="dialog-head"><h2 data-i18n="randomTitle">Пусть город удивит</h2><button class="icon-btn" data-close data-icon="x" data-aria="close"></button></div><div id="randomContent"></div><button class="btn outline" id="randomAgain" style="margin-top:18px" data-i18n="randomAgain">Ещё одна идея</button></dialog><dialog id="lightbox"><div class="dialog-head"><h2 id="lightboxTitle"></h2><button class="icon-btn" data-close data-icon="x" data-aria="close"></button></div><img id="lightboxImage" alt=""><p id="lightboxCaption"></p></dialog><dialog id="copyDialog"><div class="dialog-head"><h2 data-i18n="copyTitle">Скопируйте текст</h2><button class="icon-btn" data-close data-icon="x" data-aria="close"></button></div><textarea id="copyText" readonly style="width:100%;height:240px" data-aria="copyText"></textarea><p class="small" data-i18n="copyFallback">Выделите и скопируйте текст вручную.</p></dialog>
